<style>
/* ===== FORM ĐĂNG KÝ TƯ VẤN MỚI ===== */
#dvdt-tu-van{
  display:none;
  position:fixed;
  inset:0;
  z-index:2147483647;
  background:rgba(0,0,0,.55);
  overflow-y:auto;
  padding:50px 15px;
  box-sizing:border-box;
}

#dvdt-tu-van-box{
  position:relative;
  width:100%;
  max-width:950px;
  margin:auto;
  background:#fff;
  border-radius:6px;
  padding:35px 46px 42px;
  box-sizing:border-box;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
  font-family:Arial,sans-serif;
}

#dvdt-tu-van-close{
  position:absolute;
  right:22px;
  top:16px;
  border:0;
  background:none;
  font-size:32px;
  line-height:1;
  color:#555;
  cursor:pointer;
}

#dvdt-tu-van-title{
  text-align:center;
  font-size:34px;
  font-weight:700;
  color:#003b63;
  margin:0 0 14px;
}

#dvdt-tu-van-desc{
  text-align:center;
  color:#666;
  font-size:18px;
  margin-bottom:32px;
}

.dvdt-field{
  margin-bottom:20px;
}

.dvdt-field label{
  display:block;
  font-weight:700;
  color:#111;
  font-size:16px;
  margin-bottom:8px;
}

.dvdt-field input,
.dvdt-field select,
.dvdt-field textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid #d5d5d5;
  border-radius:5px;
  padding:13px 14px;
  font-size:16px;
  background:#fff;
  color:#222;
  outline:none;
}

.dvdt-field input:focus,
.dvdt-field select:focus,
.dvdt-field textarea:focus{
  border-color:#0b4f7c;
}

.dvdt-field textarea{
  height:110px;
  resize:vertical;
}

#dvdt-tu-van-submit{
  background:#ed1c24;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:12px 25px;
  font-size:16px;
  cursor:pointer;
}

#dvdt-tu-van-submit:hover{
  background:#d71920;
}

@media(max-width:600px){
  #dvdt-tu-van{
    padding:15px;
  }

  #dvdt-tu-van-box{
    padding:28px 20px 30px;
  }

  #dvdt-tu-van-title{
    font-size:27px;
  }

  #dvdt-tu-van-desc{
    font-size:16px;
  }
}
</style>


<!-- FORM MỚI -->
<div id="dvdt-tu-van">

  <div id="dvdt-tu-van-box">

    <button type="button" id="dvdt-tu-van-close">×</button>

    <h2 id="dvdt-tu-van-title">Đăng ký tư vấn</h2>

    <div id="dvdt-tu-van-desc">
      Vui lòng điền thông tin để chúng tôi liên hệ tư vấn.
    </div>

    <form id="dvdt-tu-van-form">

      <div class="dvdt-field">
        <label>Tên *</label>
        <input type="text" name="name" required>
      </div>

      <div class="dvdt-field">
        <label>Số điện thoại</label>
        <input type="tel" name="phone">
      </div>

      <div class="dvdt-field">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>

      <div class="dvdt-field">
        <label>Tiêu đề *</label>
        <input type="text" name="subject" value="Liên hệ" required>
      </div>

      <div class="dvdt-field">
        <label>Sản phẩm/Dịch vụ</label>
        <select name="service">
          <option>Dịch vụ rủi ro về thuế</option>
          <option>Kế toán - Thuế trọn gói</option>
          <option>Tư vấn thuế</option>
          <option>Hỗ trợ dịch vụ điện tử</option>
          <option>Hóa đơn điện tử</option>
          <option>Chữ ký số</option>
          <option>Thành lập doanh nghiệp</option>
          <option>Thay đổi nội dung giấy phép</option>
          <option>Tạm ngưng doanh nghiệp</option>
          <option>Giải thể doanh nghiệp</option>
          <option>Xin hoạt động lại doanh nghiệp</option>
          <option>Hợp đồng điện tử</option>
          <option>Hồ sơ doanh nghiệp</option>
          <option>Dịch vụ khác</option>
        </select>
      </div>

      <div class="dvdt-field">
        <label>Mô tả chi tiết</label>
        <textarea name="message"></textarea>
      </div>

      <button type="submit" id="dvdt-tu-van-submit">Gửi</button>

    </form>

  </div>
</div>


<script>
(function(){

  var formBox = document.getElementById("dvdt-tu-van");
  var closeBtn = document.getElementById("dvdt-tu-van-close");

  function openForm(){
    /* Đóng toàn bộ Google Form / modal cũ */
    document.querySelectorAll(
      'iframe[src*="docs.google.com/forms"], iframe[src*="google.com/forms"]'
    ).forEach(function(iframe){
      var parent = iframe.parentElement;
      if(parent) parent.style.display = "none";
      iframe.style.display = "none";
    });

    /* Ẩn các modal cũ đang chứa Google Form */
    document.querySelectorAll(
      '.modal, [role="dialog"], .popup, .modal-backdrop'
    ).forEach(function(el){
      if(el !== formBox && !formBox.contains(el)){
        var hasGoogleForm =
          el.querySelector &&
          el.querySelector('iframe[src*="google.com/forms"]');

        if(hasGoogleForm){
          el.style.display = "none";
          el.classList.remove("show");
        }
      }
    });

    formBox.style.display = "block";
    document.body.style.overflow = "hidden";
  }

  function closeForm(){
    formBox.style.display = "none";
    document.body.style.overflow = "";
  }

  closeBtn.addEventListener("click", closeForm);

  formBox.addEventListener("click", function(e){
    if(e.target === formBox){
      closeForm();
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      closeForm();
    }
  });

  /*
   * CHẶN NÚT "ĐĂNG KÝ TƯ VẤN"
   * Không cho chạy Google Form cũ
   */
  document.addEventListener("click", function(e){

    var el = e.target.closest("a,button");

    if(!el) return;

    var text = (
      el.innerText ||
      el.textContent ||
      el.getAttribute("aria-label") ||
      ""
    ).trim().toLowerCase();

    if(
      text.includes("đăng ký tư vấn") ||
      text.includes("dang ky tu van") ||
      text.includes("đăng kí tư vấn") ||
      text.includes("dang ki tu van")
    ){
      e.preventDefault();
      e.stopImmediatePropagation();
      openForm();
      return false;
    }

  }, true);


  /*
   * NẾU WEBSITE TỰ ĐỘNG MỞ GOOGLE FORM,
   * TỰ ĐỘNG ĐÓNG NÓ VÀ HIỆN FORM MỚI.
   */
  var observer = new MutationObserver(function(){

    var googleForm = document.querySelector(
      'iframe[src*="docs.google.com/forms"], iframe[src*="google.com/forms"]'
    );

    if(googleForm && formBox.style.display !== "block"){

      var modal = googleForm.closest(
        '.modal, [role="dialog"], .popup'
      );

      if(modal){
        modal.style.display = "none";
        modal.classList.remove("show");
      }

      googleForm.style.display = "none";

      openForm();
    }

  });

  observer.observe(document.body,{
    childList:true,
    subtree:true,
    attributes:true
  });


  /*
   * FORM GỬI
   */
  document.getElementById("dvdt-tu-van-form")
  .addEventListener("submit",function(e){

    e.preventDefault();

    alert(
      "Đã nhận thông tin đăng ký tư vấn.\n" +
      "Chúng tôi sẽ liên hệ lại với bạn sớm nhất."
    );

    this.reset();

    this.querySelector('[name="subject"]').value = "Liên hệ";

    closeForm();

  });

})();
</script>
