<style>
/* ===== ĐĂNG KÝ TƯ VẤN - POPUP ===== */
#dvdtConsultPopup{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999999;
  background:rgba(0,0,0,.55);
  padding:30px 15px;
  overflow:auto;
  box-sizing:border-box;
}

#dvdtConsultBox{
  position:relative;
  width:100%;
  max-width:760px;
  margin:20px auto;
  background:#fff;
  border-radius:8px;
  padding:35px 40px;
  box-sizing:border-box;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
  font-family:Arial,sans-serif;
}

#dvdtConsultClose{
  position:absolute;
  top:12px;
  right:18px;
  border:0;
  background:none;
  font-size:32px;
  color:#777;
  cursor:pointer;
}

#dvdtConsultBox h2{
  margin:0 0 10px;
  text-align:center;
  color:#003b63;
  font-size:30px;
}

#dvdtConsultBox .dvdt-desc{
  text-align:center;
  color:#666;
  margin-bottom:28px;
  font-size:15px;
}

.dvdt-input{
  margin-bottom:17px;
}

.dvdt-input label{
  display:block;
  margin-bottom:7px;
  font-weight:600;
  color:#222;
}

.dvdt-input input,
.dvdt-input select,
.dvdt-input textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid #d5d5d5;
  border-radius:5px;
  padding:12px 13px;
  font-size:15px;
  background:#fff;
}

.dvdt-input textarea{
  height:110px;
  resize:vertical;
}

#dvdtConsultSubmit{
  display:block;
  border:0;
  border-radius:5px;
  background:#ed1c24;
  color:#fff;
  padding:12px 28px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

#dvdtConsultSubmit:hover{
  background:#c9151c;
}

@media(max-width:600px){
  #dvdtConsultBox{
    padding:30px 20px;
  }
}
</style>

<div id="dvdtConsultPopup">
  <div id="dvdtConsultBox">

    <button type="button" id="dvdtConsultClose">×</button>

    <h2>Đăng ký tư vấn</h2>

    <div class="dvdt-desc">
      Hãy để lại thông tin và nhu cầu của bạn. Chúng tôi sẽ liên hệ tư vấn trong thời gian sớm nhất.
    </div>

    <form id="dvdtConsultForm">

      <div class="dvdt-input">
        <label>Họ và tên *</label>
        <input type="text" name="name" placeholder="Nhập họ và tên" required>
      </div>

      <div class="dvdt-input">
        <label>Số điện thoại *</label>
        <input type="tel" name="phone" placeholder="Nhập số điện thoại" required>
      </div>

      <div class="dvdt-input">
        <label>Email *</label>
        <input type="email" name="email" placeholder="Nhập email" required>
      </div>

      <div class="dvdt-input">
        <label>Tiêu đề *</label>
        <input type="text" name="subject" required>
      </div>

      <div class="dvdt-input">
        <label>Sản phẩm / Dịch vụ</label>
        <select name="service">
          <option value="">-- Chọn dịch vụ --</option>
          <option>Kế toán - Thuế trọn gói</option>
          <option>Tư vấn thuế</option>
          <option>Hóa đơn điện tử</option>
          <option>Chữ ký số</option>
          <option>Thành lập doanh nghiệp</option>
          <option>Thay đổi nội dung giấy phép</option>
          <option>Tạm ngưng doanh nghiệp</option>
          <option>Giải thể doanh nghiệp</option>
          <option>Xin hoạt động lại doanh nghiệp</option>
          <option>Hợp đồng điện tử</option>
          <option>Hồ sơ doanh nghiệp</option>
          <option>Dịch vụ khác</option>
        </select>
      </div>

      <div class="dvdt-input">
        <label>Nội dung cần tư vấn</label>
        <textarea name="message"></textarea>
      </div>

      <button type="submit" id="dvdtConsultSubmit">GỬI</button>

    </form>

  </div>
</div>

<script>
(function(){

  var popup = document.getElementById("dvdtConsultPopup");
  var close = document.getElementById("dvdtConsultClose");

  function openConsult(){
    popup.style.display = "block";
    document.body.style.overflow = "hidden";
  }

  function closeConsult(){
    popup.style.display = "none";
    document.body.style.overflow = "";
  }

  /*
   * CHẶN LINK/ NÚT ĐĂNG KÝ TƯ VẤN
   * Không cho chuyển sang Google Form.
   */
  document.addEventListener("click", function(e){

    var el = e.target.closest("a,button");

    if(!el) return;

    var text = (
      el.innerText ||
      el.textContent ||
      el.getAttribute("aria-label") ||
      ""
    ).trim().toLowerCase();

    if(
      text === "đăng ký tư vấn" ||
      text === "đăng kí tư vấn" ||
      text.indexOf("đăng ký tư vấn") !== -1 ||
      text.indexOf("đăng kí tư vấn") !== -1
    ){
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();

      openConsult();

      return false;
    }

  }, true);

  close.onclick = closeConsult;

  popup.onclick = function(e){
    if(e.target === popup){
      closeConsult();
    }
  };

  document.addEventListener("keydown",function(e){
    if(e.key === "Escape"){
      closeConsult();
    }
  });

  /*
   * CHẶN GOOGLE FORM CŨ NẾU WEBSITE CỐ MỞ NÓ
   */
  var observer = new MutationObserver(function(){

    document.querySelectorAll(
      'iframe[src*="docs.google.com/forms"],iframe[src*="google.com/forms"]'
    ).forEach(function(frame){

      var parent = frame.closest(
        '.modal,[role="dialog"],.popup'
      );

      if(parent){
        parent.style.display = "none";
      }

      frame.style.display = "none";
    });

  });

  observer.observe(document.documentElement,{
    childList:true,
    subtree:true
  });

})();
</script>
