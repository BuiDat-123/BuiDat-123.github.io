<!-- ================= ĐĂNG KÝ TƯ VẤN - FORM POPUP ================= -->
<style>
#dve-consult-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:999999;
    align-items:center;
    justify-content:center;
    padding:20px;
    box-sizing:border-box;
}

#dve-consult-box{
    position:relative;
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:#fff;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    padding:35px;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

#dve-consult-close{
    position:absolute;
    right:18px;
    top:14px;
    width:35px;
    height:35px;
    border:0;
    background:transparent;
    font-size:28px;
    line-height:35px;
    cursor:pointer;
    color:#555;
}

#dve-consult-title{
    margin:0 35px 8px 0;
    font-size:28px;
    font-weight:700;
    color:#222;
}

#dve-consult-subtitle{
    margin:0 0 25px;
    color:#777;
    font-size:15px;
    line-height:1.6;
}

.dve-form-group{
    margin-bottom:17px;
}

.dve-form-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:600;
    color:#333;
}

.dve-form-group input,
.dve-form-group select,
.dve-form-group textarea{
    width:100%;
    box-sizing:border-box;
    padding:13px 14px;
    border:1px solid #ddd;
    border-radius:6px;
    background:#fff;
    color:#333;
    font-size:15px;
    outline:none;
    transition:.2s;
}

.dve-form-group input:focus,
.dve-form-group select:focus,
.dve-form-group textarea:focus{
    border-color:#111;
    box-shadow:0 0 0 2px rgba(0,0,0,.05);
}

.dve-form-group textarea{
    min-height:110px;
    resize:vertical;
}

.dve-required{
    color:#d00;
}

#dve-consult-submit{
    width:100%;
    border:0;
    border-radius:6px;
    padding:14px 20px;
    background:#111;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

#dve-consult-submit:hover{
    background:#333;
}

#dve-consult-message{
    display:none;
    margin-top:15px;
    padding:12px 15px;
    border-radius:6px;
    font-size:14px;
    line-height:1.5;
}

#dve-consult-message.success{
    display:block;
    background:#edf8ef;
    color:#217a36;
}

#dve-consult-message.error{
    display:block;
    background:#fff0f0;
    color:#b42318;
}

@media(max-width:600px){
    #dve-consult-overlay{
        padding:10px;
    }

    #dve-consult-box{
        padding:25px 18px;
        max-height:94vh;
    }

    #dve-consult-title{
        font-size:23px;
    }
}
</style>

<div id="dve-consult-overlay">
    <div id="dve-consult-box">

        <button type="button" id="dve-consult-close" aria-label="Đóng">
            ×
        </button>

        <h2 id="dve-consult-title">Đăng ký tư vấn</h2>

        <p id="dve-consult-subtitle">
            Vui lòng để lại thông tin, chúng tôi sẽ liên hệ tư vấn trong thời gian sớm nhất.
        </p>

        <form id="dve-consult-form">

            <div class="dve-form-group">
                <label>
                    Họ và tên <span class="dve-required">*</span>
                </label>
                <input
                    type="text"
                    id="dve-name"
                    name="name"
                    placeholder="Nhập họ và tên"
                    required
                >
            </div>

            <div class="dve-form-group">
                <label>
                    Số điện thoại <span class="dve-required">*</span>
                </label>
                <input
                    type="tel"
                    id="dve-phone"
                    name="phone"
                    placeholder="Nhập số điện thoại"
                    required
                >
            </div>

            <div class="dve-form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="dve-email"
                    name="email"
                    placeholder="Nhập email"
                >
            </div>

            <div class="dve-form-group">
                <label>
                    Dịch vụ cần tư vấn <span class="dve-required">*</span>
                </label>

                <select id="dve-service" name="service" required>
                    <option value="">-- Chọn dịch vụ --</option>
                    <option value="Thành lập doanh nghiệp">
                        Thành lập doanh nghiệp
                    </option>
                    <option value="Thay đổi nội dung giấy phép">
                        Thay đổi nội dung giấy phép
                    </option>
                    <option value="Tạm ngưng doanh nghiệp">
                        Tạm ngưng doanh nghiệp
                    </option>
                    <option value="Giải thể doanh nghiệp">
                        Giải thể doanh nghiệp
                    </option>
                    <option value="Xin hoạt động lại doanh nghiệp">
                        Xin hoạt động lại doanh nghiệp
                    </option>
                    <option value="Hóa đơn điện tử">
                        Hóa đơn điện tử
                    </option>
                    <option value="Chữ ký số">
                        Chữ ký số
                    </option>
                    <option value="Hợp đồng điện tử">
                        Hợp đồng điện tử
                    </option>
                    <option value="Kế toán - Thuế trọn gói">
                        Kế toán - Thuế trọn gói
                    </option>
                    <option value="Hồ sơ doanh nghiệp">
                        Hồ sơ doanh nghiệp
                    </option>
                    <option value="Tư vấn thuế">
                        Tư vấn thuế
                    </option>
                    <option value="Khác">
                        Khác
                    </option>
                </select>
            </div>

            <div class="dve-form-group">
                <label>Nội dung cần tư vấn</label>

                <textarea
                    id="dve-content"
                    name="content"
                    placeholder="Nhập nội dung bạn cần tư vấn..."
                ></textarea>
            </div>

            <button type="submit" id="dve-consult-submit">
                Gửi đăng ký tư vấn
            </button>

            <div id="dve-consult-message"></div>

        </form>
    </div>
</div>

<script>
(function(){

    const overlay = document.getElementById("dve-consult-overlay");
    const closeBtn = document.getElementById("dve-consult-close");
    const form = document.getElementById("dve-consult-form");
    const message = document.getElementById("dve-consult-message");

    function openConsultForm(){
        overlay.style.display = "flex";
        document.body.style.overflow = "hidden";

        setTimeout(function(){
            const name = document.getElementById("dve-name");
            if(name) name.focus();
        },100);
    }

    function closeConsultForm(){
        overlay.style.display = "none";
        document.body.style.overflow = "";
    }

    /*
     * Tự động bắt tất cả nút/link có chữ:
     * "Đăng ký tư vấn"
     */
    document.addEventListener("click", function(e){

        let target = e.target.closest("a,button");

        if(!target) return;

        const text = (target.innerText || target.textContent || "")
            .trim()
            .toLowerCase();

        if(text.includes("đăng ký tư vấn")){

            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();

            openConsultForm();

            return false;
        }

    }, true);


    closeBtn.addEventListener("click", function(){
        closeConsultForm();
    });


    overlay.addEventListener("click", function(e){
        if(e.target === overlay){
            closeConsultForm();
        }
    });


    document.addEventListener("keydown", function(e){
        if(e.key === "Escape"){
            closeConsultForm();
        }
    });


    /*
     * Xử lý form
     *
     * Hiện tại KHÔNG chuyển khách sang Google Sheets.
     * Form chỉ hiển thị thông báo trên website.
     *
     * Sau khi AWS SES/API gửi email được cấu hình,
     * phần submit này có thể kết nối trực tiếp với hệ thống gửi mail.
     */
    form.addEventListener("submit", function(e){

        e.preventDefault();

        const name = document.getElementById("dve-name").value.trim();
        const phone = document.getElementById("dve-phone").value.trim();
        const email = document.getElementById("dve-email").value.trim();
        const service = document.getElementById("dve-service").value;
        const content = document.getElementById("dve-content").value.trim();

        if(!name || !phone || !service){

            message.className = "error";
            message.innerHTML =
                "Vui lòng nhập đầy đủ họ tên, số điện thoại và dịch vụ cần tư vấn.";

            return;
        }

        /*
         * Kiểm tra số điện thoại cơ bản
         */
        const phoneCheck = /^[0-9+\s().-]{8,20}$/;

        if(!phoneCheck.test(phone)){

            message.className = "error";
            message.innerHTML =
                "Vui lòng kiểm tra lại số điện thoại.";

            return;
        }


        /*
         * Hiện thông báo thành công trên website.
         * Không mở Google Sheets.
         */
        message.className = "success";

        message.innerHTML =
            "Đã tiếp nhận thông tin đăng ký tư vấn.<br>" +
            "Chúng tôi sẽ liên hệ với bạn trong thời gian sớm nhất.";

        form.reset();

    });

})();
</script>
<!-- ================= HẾT CODE ================= -->
