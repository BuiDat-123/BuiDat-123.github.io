<!-- DÁN TOÀN BỘ ĐOẠN NÀY VÀO CUỐI TRANG, TRƯỚC </body> -->

<style>
#tuvanOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:999999;
  background:rgba(0,0,0,.45);
  overflow-y:auto;
  padding:40px 20px;
  box-sizing:border-box;
}
#tuvanBox{
  width:100%;
  max-width:760px;
  margin:auto;
  background:#fff;
  border-radius:4px;
  padding:32px 38px 38px;
  box-sizing:border-box;
  position:relative;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
  font-family:Arial,sans-serif;
}
#tuvanClose{
  position:absolute;
  right:18px;
  top:12px;
  border:0;
  background:none;
  font-size:30px;
  color:#777;
  cursor:pointer;
}
#tuvanBox .tuvanIntro{
  color:#555;
  font-size:15px;
  line-height:1.7;
  margin-bottom:28px;
}
.tuvanRow{
  display:flex;
  align-items:center;
  margin-bottom:16px;
}
.tuvanRow label{
  width:200px;
  flex-shrink:0;
  font-weight:bold;
  font-size:16px;
  color:#111;
}
.tuvanRow input,
.tuvanRow select,
.tuvanRow textarea{
  width:100%;
  max-width:330px;
  box-sizing:border-box;
  border:1px solid #d8d8d8;
  border-radius:6px;
  padding:12px;
  font-size:15px;
  outline:none;
  background:#fff;
}
.tuvanRow textarea{
  height:82px;
  resize:vertical;
}
.tuvanFull{
  display:flex;
  align-items:center;
  margin-bottom:16px;
}
.tuvanFull label{
  width:200px;
  flex-shrink:0;
  font-weight:bold;
  font-size:16px;
}
.tuvanFull select{
  width:100%;
  border:1px solid #d8d8d8;
  border-radius:6px;
  padding:13px;
  font-size:15px;
}
#tuvanSubmit{
  margin-left:200px;
  background:#ed1c24;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:11px 18px;
  font-size:15px;
  cursor:pointer;
}
#tuvanSubmit:hover{
  background:#d9151c;
}
@media(max-width:600px){
  #tuvanOverlay{padding:15px;}
  #tuvanBox{padding:28px 20px;}
  .tuvanRow,
  .tuvanFull{
    display:block;
  }
  .tuvanRow label,
  .tuvanFull label{
    display:block;
    width:100%;
    margin-bottom:7px;
  }
  .tuvanRow input,
  .tuvanRow select,
  .tuvanRow textarea,
  .tuvanFull select{
    max-width:none;
  }
  #tuvanSubmit{
    margin-left:0;
  }
}
</style>

<div id="tuvanOverlay">
  <div id="tuvanBox">
    <button id="tuvanClose">&times;</button>

    <div class="tuvanIntro">
      Hãy liên hệ khi bạn gặp bất cứ vấn đề nào liên quan đến công ty hoặc dịch vụ của chúng tôi.<br>
      Chúng tôi sẽ cố gắng phản hồi trong thời gian sớm nhất.
    </div>

    <form id="tuvanForm">

      <div class="tuvanRow">
        <label>Tên *</label>
        <input type="text" name="name" required>
      </div>

      <div class="tuvanRow">
        <label>Số điện thoại</label>
        <input type="tel" name="phone">
      </div>

      <div class="tuvanRow">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>

      <div class="tuvanRow">
        <label>Tiêu đề *</label>
        <input type="text" name="subject" value="Liên hệ" required>
      </div>

      <div class="tuvanFull">
        <label>Sản phẩm/Dịch vụ</label>
        <select name="service">
          <option>Dịch vụ rủi ro về thuế</option>
          <option>Kế toán - Thuế trọn gói</option>
          <option>Tư vấn thuế</option>
          <option>Hóa đơn điện tử</option>
          <option>Chữ ký số</option>
          <option>Thành lập doanh nghiệp</option>
          <option>Thay đổi nội dung giấy phép</option>
          <option>Tạm ngưng doanh nghiệp</option>
          <option>Giải thể doanh nghiệp</option>
          <option>Xin hoạt động lại doanh nghiệp</option>
          <option>Hợp đồng điện tử</option>
          <option>Hồ sơ doanh nghiệp</option>
          <option>Dịch vụ khác</option>
        </select>
      </div>

      <div class="tuvanRow">
        <label>Mô tả chi tiết</label>
        <textarea name="message"></textarea>
      </div>

      <button type="submit" id="tuvanSubmit">Gửi</button>

    </form>
  </div>
</div>

<script>
(function(){

  function moFormTuVan(e){
    if(e) e.preventDefault();
    document.getElementById("tuvanOverlay").style.display="block";
    document.body.style.overflow="hidden";
  }

  function dongFormTuVan(){
    document.getElementById("tuvanOverlay").style.display="none";
    document.body.style.overflow="";
  }

  /*
   * TỰ ĐỘNG CHẶN LINK "ĐĂNG KÝ TƯ VẤN"
   * Không cho chuyển sang trang tính nữa.
   */
  document.addEventListener("click",function(e){

    var el=e.target.closest("a,button");

    if(!el) return;

    var text=(el.innerText || el.textContent || "").trim().toLowerCase();

    if(
      text.indexOf("đăng ký tư vấn") !== -1 ||
      text.indexOf("dang ky tu van") !== -1
    ){
      e.preventDefault();
      e.stopPropagation();
      moFormTuVan(e);
    }

  },true);

  document.getElementById("tuvanClose").onclick=dongFormTuVan;

  document.getElementById("tuvanOverlay").onclick=function(e){
    if(e.target===this){
      dongFormTuVan();
    }
  };

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
      dongFormTuVan();
    }
  });

  document.getElementById("tuvanForm").addEventListener("submit",function(e){
    e.preventDefault();

    alert("Thông tin của bạn đã được ghi nhận. Chúng tôi sẽ liên hệ lại sớm nhất.");

    this.reset();
    document.querySelector('#tuvanForm input[name="subject"]').value="Liên hệ";
    dongFormTuVan();
  });

})();
</script>
